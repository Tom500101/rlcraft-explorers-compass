# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs = -Xmx3G

# Gradle 运行 JVM：RetroFuturaGradle 2.0.6 编译自 Java 25（class file 69.0），必须用 JDK 25 启动 Gradle。
org.gradle.java.home = D:/Java/jdk-25.0.5.0.3

# Toolchain resolution (see the note in settings.gradle.kts): the foojay resolver cannot run on
# Gradle 9, so the Java 8 toolchain is picked up from local installations declared here.
# Adjust this path per machine; a JDK 8 must be present for the Java 8 compile target and for
# launching the 1.12.2 client via runClient.
org.gradle.java.installations.paths = D:/Java/jdk1.8.0_503,D:/Java/jdk-21.0.10

# Mod Information
mod_version = 1.0.0
maven_group = com.tom500101.rlcompass
mod_id = rlcompass
archives_base_name = rlcompass

# If any properties changes below this line, run `gradlew setupDecompWorkspace` and refresh gradle again to ensure everything is working correctly.

# Boilerplate Options
use_mixins = false
use_coremod = false
use_assetmover = false

# Access Transformer files should be in the root of `resources` folder and with the filename formatted as: `{archives_base_name}_at.cfg`
use_access_transformer = false

# Coremod Arguments
include_mod = true
coremod_plugin_class_name = 